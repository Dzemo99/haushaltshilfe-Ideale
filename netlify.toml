[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Saubere URLs ohne .html und sinnvolle Sicherheits-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Content-Security-Policy
    #   script-src  : eigene Skripte + Google-Tag (gtag.js)
    #                 googleadservices.com ist zwingend: gtag.js lädt für AW-IDs
    #                 zusätzlich conversion_async.js von dort nach. Fehlt der
    #                 Eintrag, blockiert der Browser die Conversion-Messung.
    #                 googleads.g.doubleclick.net ebenfalls: von dort laedt das
    #                 Tag /pagead/viewthroughconversion/… als <script> nach
    #                 (Conversion + Remarketing). Ein eigenes script-src-elem
    #                 gibt es hier bewusst nicht – ohne diese Direktive faellt
    #                 der Browser auf script-src zurueck, der Eintrag oben
    #                 deckt die script-src-elem-Meldung also mit ab.
    #   connect-src : Formspree (Formularversand) + Google (Conversion-Pings).
    #                 ad.doubleclick.net wird fuer /ccm/s/collect gebraucht,
    #                 pagead2.googlesyndication.com fuer Remarketing-Beacons.
    #   img-src     : eigene Bilder, data:-URIs (Icons im CSS) + Google-Tracking-Pixel
    #   'unsafe-inline' bei style-src: nötig für die wenigen inline-Styles im HTML
    Content-Security-Policy = """
      default-src 'self';
      base-uri 'self';
      form-action 'self' https://formspree.io;
      frame-ancestors 'self';
      object-src 'none';
      script-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://www.google-analytics.com https://googleads.g.doubleclick.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https://www.googletagmanager.com https://www.googleadservices.com https://www.google-analytics.com https://www.google.com https://www.google.de https://googleads.g.doubleclick.net https://stats.g.doubleclick.net;
      font-src 'self' data:;
      connect-src 'self' https://formspree.io https://www.googletagmanager.com https://www.googleadservices.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://www.google.com https://www.google.de https://googleads.g.doubleclick.net https://ad.doubleclick.net https://pagead2.googlesyndication.com;
      frame-src https://td.doubleclick.net https://www.googletagmanager.com https://www.googleadservices.com;
      upgrade-insecure-requests;
    """

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Saubere URLs ohne .html (Landingpages sind Ziel-URLs in Google Ads)

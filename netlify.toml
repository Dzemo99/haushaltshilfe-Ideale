[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Saubere URLs ohne .html und sinnvolle Sicherheits-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Saubere URLs ohne .html (Landingpages sind Ziel-URLs in Google Ads)
[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 301

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 301

[[redirects]]
  from = "/danke"
  to = "/danke.html"
  status = 301

[[redirects]]
  from = "/haushaltshilfe-pflegegrad"
  to = "/haushaltshilfe-pflegegrad.html"
  status = 301

[[redirects]]
  from = "/einkaufshilfe"
  to = "/einkaufshilfe.html"
